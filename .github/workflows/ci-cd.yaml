# .github/workflows/deploy-api.yml
name: Build and Deploy Polaris API

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/polaris-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/polaris-api:latest

  deploy:
    name: Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Copy docker-compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.SERVER_USERNAME }}/polaris-project/"
          
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Navigate to the project directory on the server
            cd /home/${{ secrets.SERVER_USERNAME }}/polaris-project/
            
            # Create the .env file on the server using GitHub Secrets
            echo "DOCKER_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" > .env
            echo "DOCKER_PASSWORD=${{ secrets.DOCKERHUB_TOKEN }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "IMAGE_TAG=latest" >> .env
            
            # Login to Docker Hub to avoid rate limiting
            echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            
            # Stop and remove old containers first
            echo "Stopping existing containers..."
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            
            # Pull images with retry logic
            echo "Pulling Docker images..."
            for i in {1..3}; do
              echo "Pull attempt $i..."
              if docker compose --env-file .env -f docker-compose.prod.yml pull; then
                echo "Pull successful!"
                break
              else
                echo "Pull attempt $i failed, retrying in 10 seconds..."
                sleep 10
                if [ $i -eq 3 ]; then
                  echo "All pull attempts failed!"
                  exit 1
                fi
              fi
            done
            
            # Start new containers
            echo "Starting containers..."
            docker compose --env-file .env -f docker-compose.prod.yml up -d
            
            # Wait for containers to start
            echo "Waiting for containers to start..."
            sleep 45
            
            # Check container status
            echo "Container status:"
            docker ps
            
            # Show API logs if container exists
            if docker ps --format "table {{.Names}}" | grep -q "polaris-api"; then
              echo "API logs (last 30 lines):"
              docker logs polaris-api --tail 30
            else
              echo "API container not found!"
              docker ps -a | grep polaris || echo "No polaris containers found"
            fi
            
            # Show postgres logs if container exists
            if docker ps --format "table {{.Names}}" | grep -q "polaris-postgres"; then
              echo "Postgres logs (last 10 lines):"
              docker logs polaris-postgres --tail 10
            fi
            
            # Test the API health endpoint with retry
            echo "Testing API health endpoint..."
            for i in {1..6}; do
              echo "Health check attempt $i..."
              if curl -f http://localhost:8080/health; then
                echo "API is healthy!"
                break
              else
                echo "Health check failed, retrying in 10 seconds..."
                sleep 10
                if [ $i -eq 6 ]; then
                  echo "All health checks failed!"
                  # Don't exit here, let's see what's wrong
                fi
              fi
            done
            
            # Show system resources
            echo "System resources:"
            df -h
            free -h
            
            # Clean up old images
            docker image prune -af
            
            # Logout from Docker Hub
            docker logout