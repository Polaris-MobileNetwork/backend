# docker-compose.prod.yml
services:
  # Service for your ASP.NET Core Web API
  polarisapi:
    image: ${DOCKER_USERNAME}/polaris-api:${IMAGE_TAG:-latest}
    container_name: polaris-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=BechenDB;Username=postgres;Password=${POSTGRES_PASSWORD:-1234}
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - polaris-network

  # Service for your PostgreSQL Database
  postgres-db:
    image: postgres:15
    container_name: polaris-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-1234}
      - POSTGRES_DB=BechenDB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BechenDB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - polaris-network
    # Remove port exposure in production for security
    # Uncomment only if you need external database access
    # ports:
    #   - "5432:5432"

volumes:
  postgres_data:

networks:
  polaris-network:
    driver: bridge