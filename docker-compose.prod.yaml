version: "3.8"

# This file is a template. The actual values for variables like ${...}
# are provided by the .env file created by your CI/CD pipeline.

services:
  # The SQL Server Database Service
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      # The SA_PASSWORD is read from the .env file on the server
      SA_PASSWORD: ${DB_SA_PASSWORD}
      ACCEPT_EULA: "Y"
    networks:
      - polaris-network
    volumes:
      # This ensures your database data persists even if the container is removed
      - sqlvolume:/var/opt/mssql

  # Your .NET Web API Service
  webapi:
    # The image name and tag are controlled by variables from the .env file
    image: ${DOCKER_USERNAME}/polaris-api:latest
    restart: unless-stopped
    depends_on:
      - sqlserver
    ports:
      # Exposes the container's internal port 80 to the host machine's port 5000.
      # Nginx then proxies traffic from https://api.polariss.ir to localhost:5000.
      - "5000:80"
    networks:
      - polaris-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # The connection string also uses the password variable from the .env file
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=PolarisDb;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;

# Defines the private network for containers to communicate securely
networks:
  polaris-network:

# Defines the named volume for persistent database storage
volumes:
  sqlvolume:
    # This volume is used to store SQL Server data files, ensuring data persists
    # even if the container is removed or recreated.
    driver: local
    driver_opts:
      type: none
      device: /var/opt/mssql
      o: bind