# The 'version' attribute is obsolete, you can safely remove it.
services:
  # Service for your ASP.NET Core Web API
  polarisapi:
    container_name: polaris-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=BechenDB;Username=postgres;Password=1234
    depends_on:
      # NEW: This tells the API to wait until the db service is 'healthy'
      postgres-db:
        condition: service_healthy

  # Service for your PostgreSQL Database
  postgres-db:
    container_name: postgres-db
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=BechenDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NEW: This block tells Docker how to check if Postgres is ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BechenDB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: